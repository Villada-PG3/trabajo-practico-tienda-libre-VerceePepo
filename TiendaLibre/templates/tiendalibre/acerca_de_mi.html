<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerca de mí - Pedro Vercellone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #4f46e5;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
        }
        h1 {
            font-size: 1.8rem;
            color: #111827;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #4f46e5;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: block;
        }
        .bio {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
            text-align: left;
        }
        .info-item {
            background: #f9fafb;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }
        .info-item .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #6b7280;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1f2937;
            margin-top: 2px;
        }
        .btn {
            display: inline-block;
            background-color: #f3f4f6;
            color: #374151;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">PV</div>
        <h1>Pedro Vercellone</h1>
        <span class="subtitle">Desarrollador Web</span>

        <p class="bio">
           Este es mi trabajo de Django. Tengo 18 años y estudio en ITS Villada. Me gusta mucho la programación y estoy aprendiendo a desarrollar aplicaciones web con Django.
        </p>



        <a href="/" class="btn">&larr; Volver al Inicio</a>
    </div>
</body>
</html>
